{% extends "base.html" %}
{% block title %}خطأ {{ code }} — {{ site_title }}{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-header" style="color:var(--text-primary);">
    {% include "_logo.html" %}
  </div>
  <div class="card" style="text-align:center;">
    <div style="font-size:56px;font-weight:800;color:var(--primary-blue);line-height:1.2;">{{ code }}</div>
    <h2 class="card-title">{{ message }}</h2>
    <p style="color:var(--text-secondary);line-height:1.9;">
      يمكنك العودة إلى الصفحة الرئيسية أو تسجيل الدخول من جديد.
    </p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px;">
      <a class="btn btn-primary" href="{{ url_for('home') }}">الصفحة الرئيسية</a>
      <a class="btn btn-secondary" href="{{ url_for('auth_login') }}">تسجيل الدخول</a>
    </div>
  </div>
</div>
{% endblock %}
