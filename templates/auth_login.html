{% extends "base.html" %}
{% block title %}تسجيل الدخول — {{ site_title }}{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-header" style="color:var(--text-primary);">
    {% include "_logo.html" %}
  </div>
  <div class="card">
    <h2 class="card-title">🔐 تسجيل الدخول</h2>
    <form method="post" action="{{ url_for('auth_login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label" for="identifier">رقم الجوال أو اسم المستخدم أو البريد</label>
        <input class="form-control" id="identifier" name="identifier" type="text" required placeholder="05XXXXXXXX أو username أو email@example.com">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">كلمة السر</label>
        <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password" placeholder="كلمة السر">
      </div>
      <button class="btn btn-primary btn-block" type="submit">دخول</button>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap;gap:8px;">
        <a href="{{ url_for('auth_forgot') }}" style="font-size:0.9rem;">نسيت كلمة السر؟</a>
        <span style="font-size:0.9rem;color:var(--text-secondary);">
          ليس لديك حساب؟ <a href="{{ url_for('auth_register') }}" style="font-weight:700;">سجّل الآن</a>
        </span>
      </div>
    </form>
  </div>
</div>
{% endblock %}
